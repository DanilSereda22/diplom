{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center py-12">
    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-pink-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-pink-100 text-2xl flex items-center justify-center rounded-full mx-auto mb-4">🔐</div>
            <h2 class="text-2xl font-bold text-gray-800">
                Новый пароль
            </h2>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1 ml-1">
                    Новый пароль
                </label>
                {{ form.new_password1 }}
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1 ml-1">
                    Повторите пароль
                </label>
                {{ form.new_password2 }}
            </div>

            <style>
                input[type="password"] {
                    width: 100%;
                    padding: 12px;
                    border-radius: 12px;
                    border: 1px solid #E5E7EB;
                    background-color: #F9FAFB;
                    outline: none;
                    transition: all 0.2s;
                }
                input[type="password"]:focus {
                    background-color: #fff;
                    border-color: #F9A8D4;
                    box-shadow: 0 0 0 4px #FCE7F3;
                }
            </style>

            <button type="submit"
                class="w-full bg-pink-500 text-white font-bold py-3 rounded-xl hover:bg-pink-600 shadow-lg shadow-pink-200 transition-all">
                Сменить пароль
            </button>
        </form>
    </div>
</div>
{% endblock %}
