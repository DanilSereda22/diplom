<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Сброс пароля</title>
</head>
<body style="margin:0;padding:0;background:#f9fafb;font-family:Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center" style="padding:40px 0;">
                <table width="100%" max-width="480px" style="background:#ffffff;border-radius:24px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,0.05);">
                    <tr>
                        <td align="center">
                            <div style="font-size:32px;">🔐</div>
                            <h2 style="color:#1f2937;margin:16px 0;">
                                Сброс пароля
                            </h2>
                            <p style="color:#6b7280;font-size:14px;">
                                Вы запросили восстановление пароля.
                                Нажмите кнопку ниже:
                            </p>

                            <a href="{{ protocol }}://{{ domain }}{% url 'users:password_reset_confirm' uidb64=uid token=token %}"
                               style="
                                display:inline-block;
                                margin-top:24px;
                                background:#ec4899;
                                color:#ffffff;
                                padding:14px 24px;
                                border-radius:12px;
                                font-weight:bold;
                                text-decoration:none;
                               ">
                                Сбросить пароль
                            </a>

                            <p style="margin-top:24px;font-size:12px;color:#9ca3af;">
                                Если вы не запрашивали сброс пароля —
                                просто проигнорируйте это письмо.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
