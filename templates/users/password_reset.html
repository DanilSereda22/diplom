{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center py-12">
    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-pink-100">

        <!-- HEADER -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-pink-100 text-2xl flex items-center justify-center rounded-full mx-auto mb-4">
                📧
            </div>
            <h2 class="text-2xl font-bold text-gray-800">Восстановление пароля</h2>
            <p class="text-gray-500 text-sm">Введите email, указанный при регистрации</p>
        </div>

        <!-- ERRORS -->
        {% if form.errors %}
        <div class="bg-red-50 text-red-600 p-3 rounded-xl text-sm mb-6 text-center border border-red-100">
            {{ form.email.errors.0 }}
        </div>
        {% endif %}

        <!-- FORM -->
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <!-- EMAIL FIELD -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1 ml-1">
                    Email
                </label>

                <div class="relative">
                    <!-- ICON -->
                    <div class="absolute inset-y-0 left-3 flex items-center text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-width="2"
                                  d="M16 12H8m8 0l-8 5m8-5l-8-5m13 5a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>

                    <!-- INPUT -->
                    <input type="email"
                           name="email"
                           required
                           placeholder="Введите ваш email"
                           class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 bg-gray-50
                                  focus:bg-white focus:ring-2 focus:ring-pink-200 focus:border-pink-300
                                  outline-none transition-all text-gray-700 placeholder-gray-400 shadow-sm">
                </div>
            </div>

            <!-- BUTTON -->
            <button type="submit"
                class="w-full bg-pink-500 text-white font-bold py-3 rounded-xl
                       hover:bg-pink-600 shadow-lg shadow-pink-200 transition-all
                       transform hover:-translate-y-0.5">
                Отправить ссылку
            </button>
        </form>

    </div>
</div>
{% endblock %}
