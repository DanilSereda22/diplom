{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center py-12">
    <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl border border-pink-100">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-pink-100 text-2xl flex items-center justify-center rounded-full mx-auto mb-4">📧</div>
            <h2 class="text-2xl font-bold text-gray-800">Восстановление пароля</h2>
            <p class="text-gray-500 text-sm">Введите email, указанный при регистрации</p>
        </div>

        {% if form.errors %}
        <div class="bg-red-50 text-red-600 p-3 rounded-xl text-sm mb-6 text-center border border-red-100">
            {{ form.email.errors.0 }}
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1 ml-1">Email</label>
                {{ form.email }}
            </div>

            <button type="submit"
                class="w-full bg-pink-500 text-white font-bold py-3 rounded-xl hover:bg-pink-600 shadow-lg shadow-pink-200 transition-all">
                Отправить ссылку
            </button>
        </form>
    </div>
</div>
{% endblock %}
