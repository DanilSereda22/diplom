{% extends "base.html" %}
{% block content %}

<div class="max-w-3xl mx-auto space-y-6">

  <h1 class="text-3xl font-black">
    Добавить пользователя
  </h1>

  <form method="post" class="bg-white border rounded-3xl p-6 space-y-4">
    {% csrf_token %}
    
    {{ form.non_field_errors }}

    {% for field in form %}
      <div>
        {{ field.label_tag }}
        {{ field }}
        {% if field.errors %}
          <p class="text-red-500 text-sm">{{ field.errors }}</p>
        {% endif %}
      </div>
    {% endfor %}

    <button class="px-6 py-3 bg-gray-900 text-white rounded-xl font-bold">
      Создать пользователя
    </button>
  </form>

</div>

<style>
input, select {
  width:100%;
  padding:.5rem;
  border-radius:.75rem;
  border:1px solid #e5e7eb;
  background:#f9fafb;
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const input = document.querySelector('input[name="phone"]');
    if (!input) return;

    function setCursorPosition(pos) {
        input.focus();
        input.setSelectionRange(pos, pos);
    }

    function mask(e) {
        const matrix = "+7 (___) ___-__-__";
        let i = 0;
        let def = matrix.replace(/\D/g, "");
        let val = input.value.replace(/\D/g, "");

        if (val.length < def.length) val = def;

        input.value = matrix.replace(/./g, function (a) {
            return /[_\d]/.test(a) && i < val.length
                ? val.charAt(i++)
                : i >= val.length
                ? ""
                : a;
        });

        if (e.type !== "blur") {
            setCursorPosition(input.value.length);
        } else if (input.value.length < 5) {
            input.value = "";
        }
    }

    input.addEventListener("input", mask);
    input.addEventListener("focus", mask);
    input.addEventListener("blur", mask);
});
</script>
{% endblock %}
