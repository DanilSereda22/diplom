{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="max-w-4xl mx-auto">

  <h1 class="text-3xl font-black mb-6">{{ title }}</h1>

  <form method="post" enctype="multipart/form-data" class="bg-white border rounded-3xl p-6 space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="block font-bold mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}
          <p class="text-gray-400 text-sm">{{ field.help_text }}</p>
        {% endif %}
        {% for error in field.errors %}
          <p class="text-red-500 text-sm">{{ error }}</p>
        {% endfor %}
      </div>
    {% endfor %}

    <button type="submit" class="px-4 py-2 rounded-xl bg-gray-900 text-white font-bold hover:bg-pink-500 transition text-sm">Сохранить</button>
  </form>

</div>
<script src="{% static 'js/auto_slug.js' %}"></script>
{% endblock %}
