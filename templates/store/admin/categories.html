{% extends "base.html" %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6">

  <div class="flex justify-between items-center">
    <h1 class="text-3xl font-black">Категории</h1>
    <a href="{% url 'store:admin_add_category' %}" class="px-4 py-2 rounded-xl bg-gray-900 text-white font-bold hover:bg-pink-500 transition text-sm">
      Добавить категорию
    </a>
  </div>

  <ul class="bg-white border rounded-3xl p-6 space-y-2">
    {% for category in categories %}
    <li class="flex justify-between items-center border-b p-2">
      <span>{{ category.name }}</span>
      <div class="flex gap-2">
        <a href="{% url 'store:admin_edit_category' category.id %}" class="px-4 py-2 rounded-xl bg-blue-100 text-blue-700 text-sm font-bold hover:bg-blue-200">Редактировать</a>
        <a href="{% url 'store:admin_delete_category' category.id %}" onclick="return confirm('Удалить категорию?')" class="px-4 py-2 rounded-xl bg-red-100 text-red-700 text-sm font-bold hover:bg-red-200">Удалить</a>
      </div>
    </li>
    {% empty %}
      <li class="text-gray-400 text-center p-2">Категорий нет</li>
    {% endfor %}
  </ul>

</div>
{% endblock %}
