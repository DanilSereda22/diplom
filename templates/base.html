<!-- templates/base.html -->
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SweetWorld — магазин сладостей</title>
  <!-- Tailwind via CDN for quick start -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{
      --bg: #F5F5DC; /* основной фон */
      --accent-pink: #FFD1DC;
      --accent-blue: #E0F7FA;
      --mint: #BDF2D5;
      --text: #333333;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
  </style>
</head>
<body class="min-h-screen">
  <header class="bg-white shadow">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <a href="{% url 'home' %}" class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background: var(--accent-pink);">
          <span class="font-bold text-lg">S</span>
        </div>
        <div>
          <h1 class="text-xl font-semibold">SweetWorld</h1>
          <p class="text-sm text-gray-500">Мир сладостей</p>
        </div>
      </a>

      <form action="{% url 'store:product_list' %}" method="get" class="hidden sm:block w-1/3">
        <input type="text" name="q" placeholder="Поиск по товарам..." class="w-full p-2 rounded border" />
      </form>

      <nav class="flex items-center gap-4">
        <a href="{% url 'store:product_list' %}" class="hidden sm:inline-block">Каталог</a>
        {% if user.is_authenticated %}
          <a href="{% url 'users:profile' %}">{{ user.get_full_name|default:user.username }}</a>
          <a href="{% url 'logout' %}">Выйти</a>
        {% else %}
          <a href="{% url 'login' %}">Войти</a>
          <a href="{% url 'users:register' %}" class="hidden sm:inline-block">Регистрация</a>
        {% endif %}
        <a href="{% url 'cart:cart_detail' %}" class="relative inline-flex items-center">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path d="M3 3h2l.6 3M7 13h10l4-8H5.6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="ml-1 text-sm">Корзина</span>
          <span class="absolute -top-2 -right-2 bg-pink-300 text-xs rounded-full px-2">{{ cart_counter }}</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-white mt-12 py-6">
    <div class="container mx-auto px-4 text-center text-sm text-gray-600">
      © {{ now|date:"Y" }} SweetWorld — Магазин сладостей
    </div>
  </footer>
</body>
</html>
