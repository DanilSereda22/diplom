{% extends "base.html" %}
{% block content %}

<div class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
  <h2 class="text-2xl font-black mb-6 text-gray-800">
    Оплата заказа №{{ order.id }}
  </h2>

  <form method="post" id="pay-form" class="space-y-4">
    {% csrf_token %}

    <div>
      <label class="text-xs font-bold text-gray-400 uppercase">Номер карты</label>
      <input id="card" required
        class="w-full px-4 py-3 rounded-xl border bg-gray-50 focus:ring-4 focus:ring-pink-100 outline-none"
        placeholder="0000 0000 0000 0000">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-xs font-bold text-gray-400 uppercase">Месяц / Год</label>
        <input id="date" required
          class="w-full px-4 py-3 rounded-xl border bg-gray-50 focus:ring-4 focus:ring-pink-100 outline-none"
          placeholder="MM/YY">
      </div>
      <div>
        <label class="text-xs font-bold text-gray-400 uppercase">CVC</label>
        <input id="cvc" required
          class="w-full px-4 py-3 rounded-xl border bg-gray-50 focus:ring-4 focus:ring-pink-100 outline-none"
          placeholder="123">
      </div>
    </div>

    <div>
      <label class="text-xs font-bold text-gray-400 uppercase">Имя и фамилия</label>
      <input id="name" required
        class="w-full px-4 py-3 rounded-xl border bg-gray-50 focus:ring-4 focus:ring-pink-100 outline-none"
        placeholder="IVAN IVANOV">
    </div>

    <button
      class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black
             hover:bg-pink-500 shadow-xl transition">
      Оплатить {{ order.total_price }} ₽
    </button>
  </form>

  <p class="text-xs text-gray-400 mt-4 text-center">
    Демонстрационная страница. Реальная оплата не производится.
  </p>
</div>

<script>
const f = id => document.getElementById(id);

/* CARD */
f("card").oninput = e =>
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim();

/* DATE MM/YY */
f("date").oninput = e => {
  let v = e.target.value.replace(/\D/g,'').slice(0,4);
  e.target.value = v.length > 2 ? v.slice(0,2)+'/'+v.slice(2) : v;
};

/* CVC */
f("cvc").oninput = e =>
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,3);

/* NAME (LATIN ONLY) */
f("name").oninput = e =>
  e.target.value = e.target.value.replace(/[^A-Z\s]/gi,'').toUpperCase();

/* FINAL VALIDATION */
document.getElementById("pay-form").onsubmit = () =>
  f("card").value.replace(/\s/g,'').length === 16 &&
  f("cvc").value.length === 3 &&
  f("date").value.length === 5 &&
  /^[A-Z]+ [A-Z]+$/.test(f("name").value);
</script>

{% endblock %}
